<!DOCTYPE html>
<!--
  Copyright (c) 2026 Joshua Dyar. MIT License (see LICENSE).

  Replay viewer for assembler-sim run logs (contract v1/v2/v3, see sim/metrics.py).

  Logs may carry optional per-placement structure samples (displacement and
  joint strain). Older logs omit that key and still play. The colors are a
  spring-network estimate; stiffness is not fit to printed specimens.

  Usage:
    - Open this file in a browser and drop a run-log JSON onto it (or use
      the file picker). Produce a log with `python main.py` -> runs/latest.json
    - If served over http from the repo root (e.g. `python -m http.server`),
      it auto-loads runs/latest.json.

  Three.js is loaded from a CDN, so first load needs internet access.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>assembler-sim replay</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #0b1020; color: #cbd5e1; overflow: hidden;
  }
  #scene { position: fixed; inset: 0; }
  #hud {
    position: fixed; left: 0; right: 0; top: 0; z-index: 2;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 10px 14px; background: rgba(11,16,32,.85);
    border-bottom: 1px solid #1e293b; backdrop-filter: blur(4px);
  }
  #hud button, #hud select, #hud input[type="file"]::file-selector-button {
    font: inherit; color: #e2e8f0; background: #1e293b;
    border: 1px solid #334155; border-radius: 6px; padding: 4px 12px; cursor: pointer;
  }
  #hud button:hover { background: #334155; }
  #scrub { flex: 1 1 160px; min-width: 120px; accent-color: #f97316; }
  #tick { min-width: 170px; color: #f8fafc; }
  #state { min-width: 150px; color: #fbbf24; }
  #legend { color: #64748b; }
  #legend b { font-weight: 600; }
  .vox  { color: #60a5fa; } .ghost { color: #94a3b8; }
  .bot  { color: #f97316; } .gnd   { color: #6b7280; }
  .bad  { color: #ef4444; }
  .needs-structure, .is-hidden { display: none !important; }
  #colorWrap, #deformWrap {
    display: flex; align-items: center; gap: 6px; color: #94a3b8;
  }
  #colorMode { font: inherit; color: #e2e8f0; background: #1e293b;
    border: 1px solid #334155; border-radius: 6px; padding: 4px 8px; }
  #deform { width: 200px; accent-color: #a3e635; }
  #sagReadout { color: #fde68a; min-width: 180px; }
  #colorbar {
    position: fixed; left: 14px; bottom: 16px; z-index: 2;
    display: flex; flex-direction: column; gap: 4px;
    width: 280px; padding: 8px 10px;
    background: rgba(11,16,32,.9);
    border: 1px solid #334155; border-radius: 8px;
  }
  #cbarTitle { color: #f8fafc; }
  #cbar { width: 260px; height: 14px; border-radius: 2px; }
  #cbarLabels { display: flex; justify-content: space-between; color: #94a3b8; }
  #cbarNote { color: #64748b; white-space: normal; max-width: 260px; }
  #drop {
    position: fixed; inset: 0; z-index: 3; display: grid; place-items: center;
    background: rgba(11,16,32,.92); text-align: center; padding: 24px;
  }
  #drop.hidden { display: none; }
  #drop .box {
    border: 2px dashed #334155; border-radius: 12px; padding: 48px 64px;
  }
  #drop h1 { font-size: 16px; color: #f8fafc; margin-bottom: 10px; }
  #drop p { color: #94a3b8; margin-bottom: 16px; }
</style>
</head>
<body>
<div id="scene"></div>

<div id="hud">
  <button id="play">▶ play</button>
  <input id="scrub" type="range" min="0" max="0" value="0" step="1" />
  <span id="tick">tick –/–</span>
  <span id="state"></span>
  <select id="speed">
    <option value="240">0.5×</option>
    <option value="120" selected>1×</option>
    <option value="60">2×</option>
    <option value="30">4×</option>
  </select>
  <input id="file" type="file" accept=".json,application/json" />
  <label id="colorWrap" class="needs-structure">color
    <select id="colorMode">
      <option value="material">material</option>
      <option value="displacement">displacement</option>
      <option value="axial">axial strain</option>
      <option value="shear">shear strain</option>
    </select>
  </label>
  <label id="deformWrap" class="needs-structure" title="Multiplies model displacement. 1× draws displacement/pitch in voxel lengths. Above 1× exaggerates. Unfitted k=1 can sag by several voxels, so start below 1.">scale
    <input id="deform" type="range" min="0" max="2" value="0" step="0.01" />
    <span id="deformVal">0×</span>
  </label>
  <span id="sagReadout" class="needs-structure"></span>
  <span id="cageKey" class="needs-structure"><b style="color:#fff">□</b> worst sag</span>
  <span id="legend">
    <b class="vox">■</b> voxel&nbsp; <b class="bad">■</b> defect&nbsp;
    <b class="ghost">□</b> blueprint&nbsp;
    <b class="bot">■</b> robot&nbsp; <b class="gnd">■</b> ground&nbsp;
    · space = play/pause, ←/→ = step, drag = orbit, wheel = zoom
  </span>
</div>

<div id="colorbar" class="needs-structure">
  <div id="cbarTitle">displacement (mg/k)</div>
  <canvas id="cbar" width="260" height="14"></canvas>
  <div id="cbarLabels"><span id="cbarLo">0</span><span id="cbarMid"></span><span id="cbarHi">0</span></div>
  <div id="cbarNote"></div>
</div>

<div id="drop">
  <div class="box">
    <h1>assembler-sim replay viewer</h1>
    <p>Drop a run-log JSON here (e.g. <code>runs/latest.json</code> from <code>python main.py</code>)<br>
       or pick a file in the toolbar above.</p>
  </div>
</div>

<script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";

/* ---------- scene ---------- */
const container = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(6, 10, 8);
scene.add(sun);

/* Minimal orbit: drag to rotate, wheel to zoom. */
const orbit = { theta: 0.9, phi: 1.15, radius: 16, target: new THREE.Vector3() };
function applyCamera() {
  const { theta, phi, radius, target } = orbit;
  camera.position.set(
    target.x + radius * Math.sin(phi) * Math.sin(theta),
    target.y + radius * Math.cos(phi),
    target.z + radius * Math.sin(phi) * Math.cos(theta),
  );
  camera.lookAt(target);
}
let dragging = false, px = 0, py = 0;
renderer.domElement.addEventListener("pointerdown", e => { dragging = true; px = e.clientX; py = e.clientY; });
addEventListener("pointerup", () => dragging = false);
addEventListener("pointermove", e => {
  if (!dragging) return;
  orbit.theta -= (e.clientX - px) * 0.008;
  orbit.phi = Math.min(Math.PI - 0.15, Math.max(0.15, orbit.phi - (e.clientY - py) * 0.008));
  px = e.clientX; py = e.clientY;
  applyCamera();
});
renderer.domElement.addEventListener("wheel", e => {
  e.preventDefault();
  orbit.radius = Math.min(80, Math.max(4, orbit.radius * (e.deltaY > 0 ? 1.1 : 0.9)));
  applyCamera();
}, { passive: false });

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

/* ---------- materials ---------- */
const matGround = new THREE.MeshStandardMaterial({ color: 0x4b5563, roughness: 0.9 });
const matVoxel  = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.55 });
const matDefect = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.5, emissive: 0x450a0a });
const matGhost  = new THREE.MeshStandardMaterial({ color: 0x93c5fd, transparent: true, opacity: 0.16 });
/* One color per robot id (multi-robot runs, contract v2). */
const ROBOT_COLORS = [0xf97316, 0xa855f7, 0x10b981, 0xeab308, 0xec4899, 0x14b8a6];
const matRobots = ROBOT_COLORS.map(
  c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.4 }));
const matCarry  = new THREE.MeshStandardMaterial({ color: 0x60a5fa, roughness: 0.4 });
const unitBox   = new THREE.BoxGeometry(0.96, 0.96, 0.96);

/* ---------- run state ---------- */
const LEGEND_DEFAULT = { EMPTY: 0, GROUND: 1, VOXEL: 2, DEFECT: 3 };
let run = null;           // parsed run-log JSON
let legend = LEGEND_DEFAULT;
let cells = new Map();    // "r,c" -> mesh for buildable cells
let blueprintSet = new Set();
let robotMeshes = [], carryMeshes = [];
let buildGroup = new THREE.Group();
scene.add(buildGroup);

let frame = 0, playing = false, elapsed = 0;
let highlight = null;
let scaleMax = { displacement: 0, axial: 0, shear: 0 };
const _off = new THREE.Vector3();

/* Viridis-like sequential ramp, and a blue–white–red diverging ramp
   for signed axial strain (compression on the left). */
const VIRIDIS = [[68, 1, 84], [59, 82, 139], [33, 144, 141], [93, 201, 98], [253, 231, 37]];
const DIVERGE = [[37, 99, 235], [191, 219, 254], [248, 250, 252], [254, 202, 202], [220, 38, 38]];
function ramp(stops, t) {
  t = Math.min(1, Math.max(0, t));
  const x = t * (stops.length - 1);
  const i = Math.min(stops.length - 2, Math.floor(x));
  const f = x - i;
  return stops[i].map((v, k) => Math.round(v + (stops[i + 1][k] - v) * f));
}
function fmt(v) {
  if (!Number.isFinite(v)) return "–";
  const a = Math.abs(v);
  if (a !== 0 && (a < 0.01 || a >= 1000)) return v.toExponential(2);
  return v.toFixed(3);
}
function dispOffset(node, u, target) {
  // Cell-coordinate displacement -> Three.js axes. 3D node is
  // [level, row, col] drawn as (col, level, row). 2D row grows downward.
  if (node.length === 3) target.set(u[2] || 0, u[0] || 0, u[1] || 0);
  else target.set(u[1] || 0, -(u[0] || 0), 0);
  return target;
}
function indexSample(s) {
  if (!s || s.error) return null;
  if (s._idx) return s._idx;
  const disp = new Map();
  for (const d of s.displacements || []) disp.set(d.cell.join(","), d.u);
  const axial = new Map();
  const shear = new Map();
  for (const j of s.joints || []) {
    for (const cell of [j.a, j.b]) {
      const key = cell.join(",");
      const prevA = axial.get(key);
      if (prevA === undefined || Math.abs(j.axial) > Math.abs(prevA)) axial.set(key, j.axial);
      const prevS = shear.get(key);
      if (prevS === undefined || j.shear > prevS) shear.set(key, j.shear);
    }
  }
  s._idx = { disp, axial, shear };
  return s._idx;
}
function structureAt(frameIndex) {
  for (let i = frameIndex; i >= 0; i--) {
    const s = run.ticks[i].structure;
    if (s) return { sample: s, tick: run.ticks[i].tick };
  }
  return null;
}
function computeScales(data) {
  scaleMax = { displacement: 0, axial: 0, shear: 0 };
  for (const f of data.ticks) {
    const s = f.structure;
    if (!s || s.error) continue;
    for (const d of s.displacements || []) {
      const n = Math.hypot(...d.u);
      if (n > scaleMax.displacement) scaleMax.displacement = n;
    }
    for (const j of s.joints || []) {
      scaleMax.axial = Math.max(scaleMax.axial, Math.abs(j.axial));
      scaleMax.shear = Math.max(scaleMax.shear, j.shear);
    }
  }
}
function paint(mesh, rgb) {
  let mat = mesh.userData.paint;
  if (!mat) {
    mat = matVoxel.clone();
    mesh.userData.paint = mat;
  }
  mat.color.setRGB(rgb[0] / 255, rgb[1] / 255, rgb[2] / 255);
  mesh.material = mat;
}
function colorFor(key, mode, held) {
  if (!held || held.sample.error || mode === "material") return null;
  const idx = indexSample(held.sample);
  if (!idx) return null;
  if (mode === "displacement") {
    const u = idx.disp.get(key);
    if (!u) return null;
    return ramp(VIRIDIS, Math.hypot(...u) / (scaleMax.displacement || 1));
  }
  if (mode === "axial") {
    if (!idx.axial.has(key)) return null;
    const t = (idx.axial.get(key) / (scaleMax.axial || 1) + 1) / 2;
    return ramp(DIVERGE, t);
  }
  if (mode === "shear") {
    if (!idx.shear.has(key)) return null;
    return ramp(VIRIDIS, idx.shear.get(key) / (scaleMax.shear || 1));
  }
  return null;
}
function drawColorbar(mode) {
  const meta = (run.meta && run.meta.structure) || {};
  if (mode === "material") {
    $("colorbar").classList.add("is-hidden");
    return;
  }
  $("colorbar").classList.remove("is-hidden");
  const du = meta.displacement_units || "mg/k";
  let title, lo, hi, mid, stops;
  if (mode === "displacement") {
    title = `displacement (${du})`;
    lo = "0";
    hi = fmt(scaleMax.displacement);
    mid = fmt(scaleMax.displacement / 2);
    stops = VIRIDIS;
  } else if (mode === "axial") {
    title = "axial strain proxy (Δu / pitch)";
    lo = fmt(-scaleMax.axial);
    hi = fmt(scaleMax.axial);
    mid = "0";
    stops = DIVERGE;
  } else {
    title = "shear strain proxy (Δu / pitch)";
    lo = "0";
    hi = fmt(scaleMax.shear);
    mid = fmt(scaleMax.shear / 2);
    stops = VIRIDIS;
  }
  $("cbarTitle").textContent = title;
  $("cbarLo").textContent = lo;
  $("cbarMid").textContent = mid;
  $("cbarHi").textContent = hi;
  $("cbarNote").textContent = meta.note
    || "Model estimate. Stiffness has not been fit to printed specimens.";
  const canvas = $("cbar");
  const ctx = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;
  const img = ctx.createImageData(w, h);
  for (let x = 0; x < w; x++) {
    const [r, g, b] = ramp(stops, x / (w - 1));
    for (let y = 0; y < h; y++) {
      const i = (y * w + x) * 4;
      img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = b; img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

const $ = id => document.getElementById(id);
const scrub = $("scrub"), tickLabel = $("tick"), stateLabel = $("state");
const playBtn = $("play"), speedSel = $("speed");

/* Node -> world position. v1/v2 nodes are [row, col] (row 0 = top,
   ground at the bottom row); v3 nodes are [level, row, col] (level 0 =
   ground plane, up is +level). Both map onto the same Three.js space. */
function nodePos(node) {
  const { rows, cols } = run.meta;
  if (node.length === 3) {
    const [l, r, c] = node;
    return new THREE.Vector3(c - (cols - 1) / 2, l, r - (rows - 1) / 2);
  }
  const [r, c] = node;
  return new THREE.Vector3(c - (cols - 1) / 2, (rows - 1) - r, 0);
}
const occAt = (occ, n) =>
  n.length === 3 ? occ[n[0]][n[1]][n[2]] : occ[n[0]][n[1]];

function loadRun(data) {
  if (!data || ![1, 2, 3].includes(data.version) || !Array.isArray(data.ticks) || data.ticks.length === 0) {
    alert("Not a v1/v2/v3 run log (expected {version:1|2|3, ticks:[...]}).");
    return;
  }
  run = data;
  legend = (data.meta && data.meta.legend) || LEGEND_DEFAULT;
  const { rows, cols, levels } = data.meta;

  scene.remove(buildGroup);
  buildGroup = new THREE.Group();
  scene.add(buildGroup);
  cells = new Map();
  blueprintSet = new Set(data.blueprint.map(n => n.join(",")));

  const nodes = [];
  if (data.version === 3) {
    for (let l = 0; l < levels; l++)
      for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++) nodes.push([l, r, c]);
  } else {
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++) nodes.push([r, c]);
  }

  const occ0 = data.ticks[0].occupancy;
  for (const n of nodes) {
    const pos = nodePos(n);
    if (occAt(occ0, n) === legend.GROUND) {
      const g = new THREE.Mesh(unitBox, matGround);
      g.position.copy(pos);
      buildGroup.add(g);
    } else {
      const m = new THREE.Mesh(unitBox, matVoxel);
      m.position.copy(pos);
      m.userData.rest = pos.clone();
      m.visible = false;
      buildGroup.add(m);
      cells.set(n.join(","), m);
    }
  }

  const frameCrew = f => f.robots ?? (f.robot ? [f.robot] : []);
  const maxRobots = Math.max(0, ...data.ticks.map(f => frameCrew(f).length));
  robotMeshes = []; carryMeshes = [];
  for (let i = 0; i < maxRobots; i++) {
    const rm = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7),
                              matRobots[i % matRobots.length]);
    const cm = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), matCarry);
    rm.visible = cm.visible = false;
    buildGroup.add(rm, cm);
    robotMeshes.push(rm); carryMeshes.push(cm);
  }

  highlight = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(1.12, 1.12, 1.12)),
    new THREE.LineBasicMaterial({ color: 0xffffff }),
  );
  highlight.visible = false;
  buildGroup.add(highlight);

  const structural = data.ticks.some(t => t.structure);
  for (const id of ["colorWrap", "deformWrap", "sagReadout", "cageKey", "colorbar"]) {
    $(id).classList.toggle("needs-structure", !structural);
  }
  computeScales(data);
  const colorNames = new Set([...$("colorMode").options].map(o => o.value));
  const requestedColor = viewParams.get("color");
  $("colorMode").value = (requestedColor && colorNames.has(requestedColor))
    ? requestedColor
    : (structural ? "displacement" : "material");
  const requestedScale = viewParams.get("deform");
  $("deform").value = requestedScale != null && requestedScale !== "" ? requestedScale : "0";
  $("deformVal").textContent = "0×";

  orbit.target = new THREE.Vector3(0, (data.version === 3 ? levels : rows) / 2, 0);
  orbit.radius = Math.max(rows, cols, (levels || 0) * 2) * 1.9;
  if (viewParams.has("theta")) orbit.theta = Number(viewParams.get("theta"));
  if (viewParams.has("phi")) orbit.phi = Number(viewParams.get("phi"));
  if (viewParams.has("radius")) orbit.radius = Number(viewParams.get("radius"));
  applyCamera();

  scrub.max = String(data.ticks.length - 1);
  const requestedFrame = viewParams.get("frame");
  const initial = requestedFrame === "last"
    ? data.ticks.length - 1
    : (requestedFrame != null && requestedFrame !== "" ? Number(requestedFrame) : 0);
  setFrame(Number.isFinite(initial) ? initial : 0);
  setPlaying(requestedFrame == null);
  $("drop").classList.add("hidden");
}

function setFrame(i) {
  if (!run) return;
  frame = Math.max(0, Math.min(run.ticks.length - 1, i));
  const f = run.ticks[frame];
  const occ = f.occupancy;

  const mode = $("colorMode").value;
  const scale = Number($("deform").value) || 0;
  const held = structureAt(frame);
  const meta = (run.meta && run.meta.structure) || {};
  const pitch = meta.pitch || 1;
  const idx = held && !held.sample.error ? indexSample(held.sample) : null;

  for (const [key, mesh] of cells) {
    const n = key.split(",").map(Number);
    const v = occAt(occ, n);
    const solid = v === legend.VOXEL || (legend.DEFECT !== undefined && v === legend.DEFECT);
    if (solid) {
      mesh.visible = true;
      const rgb = colorFor(key, mode, held);
      if (rgb) paint(mesh, rgb);
      else mesh.material = (v === legend.DEFECT) ? matDefect : matVoxel;
    } else if (blueprintSet.has(key)) {
      mesh.visible = true; mesh.material = matGhost;
    } else {
      mesh.visible = false;
    }
    mesh.position.copy(mesh.userData.rest);
    if (solid && idx && scale !== 0) {
      const u = idx.disp.get(key);
      if (u) mesh.position.add(dispOffset(n, u, _off).multiplyScalar(scale / pitch));
    }
  }

  if (highlight) {
    const cell = held && !held.sample.error ? held.sample.worst_sag_cell : null;
    let shown = false;
    if (cell) {
      const mesh = cells.get(cell.join(","));
      const v = occAt(occ, cell);
      const solid = v === legend.VOXEL || (legend.DEFECT !== undefined && v === legend.DEFECT);
      if (mesh && solid) {
        highlight.position.copy(mesh.position);
        highlight.visible = true;
        shown = true;
      }
    }
    if (!shown) highlight.visible = false;
  }
  if (!run.ticks.some(t => t.structure)) {
    $("sagReadout").textContent = "";
  } else if (!held) {
    $("sagReadout").textContent = "no structural sample yet";
    $("colorbar").classList.add("is-hidden");
  } else if (held.sample.error) {
    $("sagReadout").textContent = "structure undefined";
    $("colorbar").classList.add("is-hidden");
  } else {
    const du = meta.displacement_units || "mg/k";
    const where = held.sample.worst_sag_cell ? held.sample.worst_sag_cell.join(",") : "–";
    const from = held.tick === f.tick ? "" : ` · held from tick ${held.tick}`;
    $("sagReadout").textContent =
      `worst sag ${fmt(held.sample.worst_sag)} ${du} @ ${where}${from}`;
    drawColorbar(mode);
  }
  $("deformVal").textContent = `${scale}×`;

  const crew = f.robots ?? (f.robot ? [f.robot] : []);
  for (let i = 0; i < robotMeshes.length; i++) {
    const robot = crew[i];
    if (robot) {
      const pos = nodePos(robot.pos);
      robotMeshes[i].position.copy(pos);
      robotMeshes[i].visible = true;
      carryMeshes[i].position.copy(pos).add(new THREE.Vector3(0, 0.62, 0));
      carryMeshes[i].visible = !!robot.carrying;
    } else {
      robotMeshes[i].visible = carryMeshes[i].visible = false;
    }
  }
  stateLabel.textContent =
    crew.length === 1
      ? crew[0].state + (crew[0].carrying ? " ●" : "")
      : crew.map((r, i) => `r${i}:${r.state}${r.carrying ? "●" : ""}`).join("  ");

  scrub.value = String(frame);
  tickLabel.textContent =
    `tick ${f.tick}/${run.ticks[run.ticks.length - 1].tick} · placed ${f.placed}/${run.blueprint.length}`;
}

function setPlaying(on) {
  playing = on && !!run;
  playBtn.textContent = playing ? "❚❚ pause" : "▶ play";
}

/* ---------- controls ---------- */
playBtn.addEventListener("click", () => setPlaying(!playing));
scrub.addEventListener("input", () => { setPlaying(false); setFrame(Number(scrub.value)); });
addEventListener("keydown", e => {
  const tag = e.target && e.target.tagName;
  if (tag === "INPUT" || tag === "SELECT") return;
  if (e.code === "Space") { e.preventDefault(); setPlaying(!playing); }
  if (e.code === "ArrowRight") { setPlaying(false); setFrame(frame + 1); }
  if (e.code === "ArrowLeft") { setPlaying(false); setFrame(frame - 1); }
});
$("colorMode").addEventListener("change", () => setFrame(frame));
$("deform").addEventListener("input", () => setFrame(frame));

async function loadFile(file) {
  try { loadRun(JSON.parse(await file.text())); }
  catch (err) { alert("Could not parse JSON: " + err.message); }
}
$("file").addEventListener("change", e => e.target.files[0] && loadFile(e.target.files[0]));
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => {
  e.preventDefault();
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});

/* Optional view: ?log=runs/bridge.json&frame=last&color=displacement&deform=0.15
   1× on the scale slider is the model displacement in voxel lengths. */
const viewParams = new URLSearchParams(location.search);

/* Auto-load runs/latest.json when served over http (fails silently on file://). */
fetch(viewParams.get("log") || "runs/latest.json")
  .then(r => (r.ok ? r.json() : Promise.reject()))
  .then(loadRun)
  .catch(() => {});

/* ---------- loop ---------- */
let last = performance.now();
function tickLoop(now) {
  requestAnimationFrame(tickLoop);
  const dt = now - last;
  last = now;
  if (playing) {
    elapsed += dt;
    const interval = Number(speedSel.value);
    while (elapsed >= interval) {
      elapsed -= interval;
      if (frame >= run.ticks.length - 1) { setPlaying(false); break; }
      setFrame(frame + 1);
    }
  }
  renderer.render(scene, camera);
}
applyCamera();
requestAnimationFrame(tickLoop);
</script>
</body>
</html>
